<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Reset password · Folio Lab Studio</title>
  <link rel="stylesheet" href="/studio/reset-password.css?v=1">
  <script type="module" src="/studio/reset-password.js?v=1"></script>
</head>
<body>
  <main class="account-card" aria-labelledby="reset-title">
    <p class="account-brand">Folio Lab Studio</p>
    <h1 id="reset-title">Forgot password?</h1>
    <p id="reset-description">Enter your Studio email and we’ll send you a reset link.</p>
    <form id="request-form">
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <button type="submit">Send reset link</button>
    </form>
    <form id="password-form" hidden>
      <label>New password<input name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="password-hint"></label>
      <p class="hint" id="password-hint">Use at least 8 characters.</p>
      <label>Confirm password<input name="confirm" type="password" autocomplete="new-password" minlength="8" required></label>
      <button type="submit">Update password</button>
    </form>
    <p id="reset-status" role="status" aria-live="polite"></p>
    <a id="new-link" href="" hidden>Request a new reset link</a>
    <a class="back-link" href="/studio/visual.html">Back to sign in</a>
    <noscript><p>Enable JavaScript to reset your password.</p></noscript>
  </main>
</body>
</html>
